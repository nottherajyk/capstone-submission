[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrank-capstone"
version = "1.0.0"
description = "Applied Search Intelligence: Future Content Deterioration and Refresh Prioritization"
readme = "README.md"
authors = [{ name = "FlyRank Research Candidate" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "duckdb>=0.9.0",
    "pytest>=7.4.0",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
