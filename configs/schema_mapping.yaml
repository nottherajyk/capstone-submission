# Schema Mapping and Feature Provenance Registry
# Audited based on actual FlyRank warehouse inspection (FlyRank/internship-warehouse v20260703)

dataset:
  name: "FlyRank Applied Search Intelligence"
  repo: "FlyRank/internship-warehouse"
  root_path: "hf://datasets/FlyRank/internship-warehouse"
  release: "v20260703"
  inspection_status: "AUDITED_AGAINST_REAL_WAREHOUSE"
  notes: "Authoritative schema mapping for content performance records"

analytical_grain:
  description: "client_hash_id × content_hash_id × report_date"
  keys:
    - "client_hash_id"
    - "content_hash_id"
    - "report_date"

warehouse_sources:
  daily_performance: "hf://datasets/FlyRank/internship-warehouse/fact_content_daily_performance/**/*.parquet"
  dim_clients: "hf://datasets/FlyRank/internship-warehouse/dim_clients.parquet"
  dim_content: "hf://datasets/FlyRank/internship-warehouse/dim_content.parquet"
  query_90d: "hf://datasets/FlyRank/internship-warehouse/fact_content_query_90d.parquet"
  sample: "hf://datasets/FlyRank/internship-warehouse/fact_content_daily_performance_sample.parquet"

canonical_roles:
  client_id: "client_hash_id"
  content_id: "content_hash_id"
  report_date: "report_date"

identifiers:
  client_id:
    canonical: "client_hash_id"
    aliases: ["client_hash_id", "client_id", "account_id", "tenant_id", "site_id"]
    type: "string"
    role: "client_identifier"
    public_safety: "anonymized_hash"
    is_safe_feature: false
    notes: "Anonymized client organization identifier hash"
  content_id:
    canonical: "content_hash_id"
    aliases: ["content_hash_id", "content_id", "page_hash", "url_id", "page_id", "doc_id"]
    type: "string"
    role: "content_identifier"
    public_safety: "anonymized_hash"
    is_safe_feature: false
    notes: "Anonymized content/URL identifier hash"
  report_date:
    canonical: "report_date"
    aliases: ["report_date", "date", "observation_date", "period_end", "snapshot_date", "week_end_date"]
    type: "datetime"
    role: "temporal_observation_field"
    is_safe_feature: false
    notes: "Temporal observation timestamp for daily performance observation"

# Raw Performance Metrics expected in source tables & missingness semantics
raw_metrics:
  clicks:
    canonical: "clicks"
    aliases: ["clicks", "organic_clicks", "gsc_clicks", "click_count"]
    type: "float"
    role: "performance_metric"
    missingness_treatment: "zero_impute"
    notes: "Daily organic click volume from GSC; missing implies 0 clicks"
  impressions:
    canonical: "impressions"
    aliases: ["impressions", "organic_impressions", "gsc_impressions", "impression_count"]
    type: "float"
    role: "performance_metric"
    missingness_treatment: "zero_impute"
    notes: "Daily organic impressions from GSC; missing implies 0 impressions"
  position:
    canonical: "gsc_avg_position"
    aliases: ["gsc_avg_position", "avg_position", "average_position", "position", "rank"]
    type: "float"
    role: "performance_metric"
    missingness_treatment: "preserve_or_default_max_rank"
    notes: "Observed ~79.75% null in raw warehouse. Null indicates lack of rank tracking or zero impressions, NOT rank 0."
  gsc_sum_position:
    canonical: "gsc_sum_position"
    aliases: ["gsc_sum_position"]
    type: "float"
    role: "performance_metric"
    missingness_treatment: "preserve"
  ga4_pageviews:
    canonical: "ga4_pageviews"
    aliases: ["ga4_pageviews", "pageviews"]
    type: "float"
    role: "engagement_metric"
    missingness_treatment: "structural_absence_flag"
    notes: "Observed ~20% null due to ga4_data_available=false. Represents structural absence, NOT true zero pageviews."
  ga4_sessions:
    canonical: "ga4_sessions"
    aliases: ["ga4_sessions", "sessions"]
    type: "float"
    role: "engagement_metric"
    missingness_treatment: "structural_absence_flag"
    notes: "Observed ~20% null due to ga4_data_available=false"
  ga4_users:
    canonical: "ga4_users"
    aliases: ["ga4_users", "users"]
    type: "float"
    role: "engagement_metric"
    missingness_treatment: "structural_absence_flag"
  ga4_engaged_sessions:
    canonical: "ga4_engaged_sessions"
    aliases: ["ga4_engaged_sessions"]
    type: "float"
    role: "engagement_metric"
    missingness_treatment: "structural_absence_flag"

availability_flags:
  client_has_gsc:
    canonical: "client_has_gsc"
    type: "bool"
    role: "integration_availability_flag"
  client_has_ga4:
    canonical: "client_has_ga4"
    type: "bool"
    role: "integration_availability_flag"
  gsc_data_available:
    canonical: "gsc_data_available"
    type: "bool"
    role: "daily_data_availability_flag"
  ga4_data_available:
    canonical: "ga4_data_available"
    type: "bool"
    role: "daily_data_availability_flag"

# Blocked Precomputed & Target-Derived Fields (MUST NEVER ENTER FEATURE MATRIX)
blocked_fields:
  - name: "trend_direction"
    reason: "Precomputed outcome label derivative (future leakage)"
    status: "BLOCKED"
  - name: "trend_pct"
    reason: "Precomputed temporal delta encompassing future label window"
    status: "BLOCKED"
  - name: "health_score"
    reason: "Proprietary precomputed downstream health score"
    status: "BLOCKED"
  - name: "recommended_action"
    reason: "Precomputed operational action tag"
    status: "BLOCKED"
  - name: "future_clicks"
    reason: "Direct future observation window measurement"
    status: "BLOCKED"
  - name: "future_impressions"
    reason: "Direct future observation window measurement"
    status: "BLOCKED"
  - name: "is_declining_label"
    reason: "Target variable"
    status: "BLOCKED"

# Feature Registry with Full Provenance and Leakage Auditing
features:
  - feature_name: "log_clicks_lookback"
    source_table: "search_performance"
    source_columns: ["clicks"]
    observation_time_rule: "Aggregated strictly over [T-28, T]"
    lookback_window: "28d"
    future_dependency: false
    target_dependency: false
    leakage_status: "SAFE"
    notes: "Log1p transformed click volume to capture scale without outlier skew"

  - feature_name: "log_impressions_lookback"
    source_table: "search_performance"
    source_columns: ["impressions"]
    observation_time_rule: "Aggregated strictly over [T-28, T]"
    lookback_window: "28d"
    future_dependency: false
    target_dependency: false
    leakage_status: "SAFE"
    notes: "Log1p transformed impression exposure during observation window"

  - feature_name: "observed_ctr"
    source_table: "search_performance"
    source_columns: ["clicks", "impressions"]
    observation_time_rule: "clicks / max(impressions, 1) over [T-28, T]"
    lookback_window: "28d"
    future_dependency: false
    target_dependency: false
    leakage_status: "SAFE"
    notes: "Historical click-through rate ratio"

  - feature_name: "avg_position_lookback"
    source_table: "search_performance"
    source_columns: ["position", "gsc_avg_position"]
    observation_time_rule: "Mean search ranking position over [T-28, T]"
    lookback_window: "28d"
    future_dependency: false
    target_dependency: false
    leakage_status: "SAFE"
    notes: "Average organic ranking position in Google SERPs (default 20.0 for unobserved)"

  - feature_name: "position_momentum_ratio"
    source_table: "search_performance"
    source_columns: ["position", "gsc_avg_position"]
    observation_time_rule: "Mean position [T-14, T] divided by Mean position [T-28, T-15]"
    lookback_window: "28d"
    future_dependency: false
    target_dependency: false
    leakage_status: "SAFE"
    notes: "Recent position trajectory relative to earlier observation baseline"

  - feature_name: "traffic_velocity_ratio"
    source_table: "search_performance"
    source_columns: ["clicks"]
    observation_time_rule: "Clicks in [T-14, T] divided by Clicks in [T-28, T-15]"
    lookback_window: "28d"
    future_dependency: false
    target_dependency: false
    leakage_status: "SAFE"
    notes: "Recent click velocity ratio within historical window"

  - feature_name: "impression_volatility"
    source_table: "search_performance"
    source_columns: ["impressions"]
    observation_time_rule: "Standard deviation of daily impressions in [T-28, T]"
    lookback_window: "28d"
    future_dependency: false
    target_dependency: false
    leakage_status: "SAFE"
    notes: "Volatility in search demand exposure"

  - feature_name: "active_day_ratio"
    source_table: "search_performance"
    source_columns: ["clicks"]
    observation_time_rule: "Days with >= 1 click in [T-28, T] divided by 28"
    lookback_window: "28d"
    future_dependency: false
    target_dependency: false
    leakage_status: "SAFE"
    notes: "Traffic consistency indicator"

  - feature_name: "ga4_available_indicator"
    source_table: "search_performance"
    source_columns: ["ga4_data_available", "ga4_pageviews"]
    observation_time_rule: "Binary indicator for whether GA4 analytics data is available"
    lookback_window: "28d"
    future_dependency: false
    target_dependency: false
    leakage_status: "SAFE"
    notes: "Distinguishes structural absence of GA4 data from zero pageviews"
